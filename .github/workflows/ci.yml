name: ci

# ADR-0077 (v1.0 re-architecture): the project had NO test CI before this — only
# release.yml. This workflow gates `main` (and the `develop` integration branch):
# `cargo test --workspace` must stay green, and the repository invariants (the
# UI never calls git2, and the rest) are enforced by the `kagi-checks` uv
# project in `ci/`. fmt/clippy and the Linux test leg are ADVISORY for now
# (the v0.2.0 tree carries pre-existing fmt/clippy debt; making them blocking would
# red the board on day one — they are tracked for cleanup in S7).

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Only installer/packaging changes pay for a second Linux release build.
  # workflow_dispatch deliberately exercises the install proof regardless of diff.
  changes:
    name: installer paths
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.dispatch.outputs.installer || steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            installer:
              - 'install.sh'
              - 'xtask/**'
              - '.github/workflows/*.yml'
              - 'ci/src/kagi_checks/install_fixture.py'
              - 'ci/pyproject.toml'
              - 'ci/uv.lock'
      - id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo 'installer=true' >> "$GITHUB_OUTPUT"

  # ── BLOCKING: repository invariants (one uv project, one dialect) ────────────
  #
  # Every gate lives in `ci/` as a uv project (`kagi-checks`) and runs as
  # `uv run --frozen --project ci check-<name>`. It used to be inline
  # `grep -rnE` here plus `find | awk` shell scripts: three dialects, each
  # platform-sensitive. BSD grep (what developers run on macOS) caps bounded
  # repetition at 255, so a valid GNU pattern silently matched *nothing* and
  # the gate went green having checked zero files — that shipped once (#454)
  # and a human, not CI, caught it. `check-all --selftest` now proves every
  # rule still flags its own positive sample, and `check-shell-hygiene` fails
  # the build if a gate reaches for grep/find/awk/sed -i or a bare interpreter
  # again.
  #
  # Jobs stay one-per-invariant so a red status check names the rule it broke.
  invariants:
    name: invariant — ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          # UI is git2-free (ADR-0072 / ADR-0078)
          - ui-git2
          # raw ActiveModal storage is owned by the arbitration seam (#718)
          - modal-slot-storage
          - app-layering
          - fault-test-only
          # kagi-mcp is gpui-free (ADR-0163 / #331)
          - mcp-gpui
          # [kagi] contract lines go through klog!. Two gates on purpose:
          # `klog-raw` rejects every same-line `eprintln!("[kagi]…")` outright,
          # `klog` is the ratchet that tolerates the pre-existing *wrapped*
          # violations at their baseline count. The ratchet alone would let a
          # file swap a wrapped violation for a fresh same-line one at an
          # unchanged count (review finding, ADR-0096 / #396).
          - klog-raw
          - klog
          # kagi-ui-* crates never touch git2 / kagi-git (ADR-0121)
          - ui-core-layering
          # …nor import a sibling feature crate (ADR-0121)
          - ui-lateral
          # the ADR-0129 Verbatim escape hatch stays deleted
          - plan-verbatim
          # recovery guidance must never recommend a hard reset (#456)
          - recovery-safe-advice
          # modal file lists are not silently truncated (#454)
          - modal-lists
          # gates stay in one dialect (this file included)
          - shell-hygiene
          # GUI E2E windows go through the budgeted helper (#549)
          - e2e-window-helper
          # canonical verification recipe references must remain real files (#544)
          - skill-refs
          - busy-labels
          # an in-flight indicator is an animated element, never a ⟳ glyph
          # that cannot turn (user report)
          - static-spinner
          # a `\` continuation never glues two words in a string literal —
          # it broke both PR GraphQL queries (#837, #843)
          - string-continuation
          # one 4-digit number, one ADR — parallel merges produced two
          # duplicate numbers before this gate existed (#620)
          - adr-unique-number
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: check-${{ matrix.check }}
        run: uv run --frozen --project ci check-${{ matrix.check }}

  # ── BLOCKING: the gates themselves stay lint-clean and type-checked ─────────
  gates-lint:
    name: gates — ruff + mypy + selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --frozen --project ci ruff check ci
      - name: ruff format --check
        run: uv run --frozen --project ci ruff format --check ci
      - name: mypy
        run: uv run --frozen --project ci mypy --config-file ci/pyproject.toml
      - name: rule selftest
        run: uv run --frozen --project ci check-all --selftest
      - name: release gate fixtures
        run: uv run --frozen --project ci python -m unittest kagi_checks.test_release_ci -v

  # ── BLOCKING: full test suite on macOS (the validated dev platform) ──────────
  test-macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  # ── BLOCKING: Windows release build + job-object stop proof (#703b, #728) ────
  # The `proc::job::` step below is the only place the Windows stop proof runs,
  # so this leg feeds `blocking-ci` alongside `test (macOS)`: while it was advisory a
  # regression in that proof could land unnoticed (ADR-0196 decision 5, Wave 3).
  build-windows:
    name: build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release -p kagi
        run: cargo build --release -p kagi
      # #703b: the Windows stop proof is a job object, and this is the only
      # place it actually runs. Release, so it reuses the dependencies the build
      # above already compiled; `proc::job::` and `ops::clone::` (the cfg(windows)
      # clone command, #926) only, because the rest of the suite is unix-shaped
      # (it spawns `sleep`, `sh`, `true`).
      - name: "cargo test --release -p kagi-git --lib -- proc::job:: ops::clone::"
        run: "cargo test --release -p kagi-git --lib -- proc::job:: ops::clone::"
      - name: Bundle Windows zip
        run: cargo run -p xtask -- bundle-windows --bin target/release/kagi.exe
      - name: List dist
        run: dir target\dist

  # This dependency list is the sole authority for release-blocking CI.
  # `always()` is essential: a failed/skipped dependency must produce a red
  # aggregate, not skip the verification step. Matrix success covers every leg.
  # Only install-linux may be skipped, and only when changes selected false.
  blocking-ci:
    needs: [changes, invariants, gates-lint, test-macos, build-windows, install-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Require every selected blocking dependency to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: uv run --frozen --project ci check-blocking-ci

  # ── ADVISORY: Linux tests; conditional release artifact for blocking install ─
  test-linux:
    name: test (Linux, advisory)
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install gpui system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            libasound2-dev \
            libvulkan-dev \
            libzstd-dev
      - name: Build actual Linux binary for installer
        if: needs.changes.outputs.installer == 'true'
        run: cargo build --release -p kagi
      - name: Bundle installer tar and checksum
        if: needs.changes.outputs.installer == 'true'
        run: |
          cargo run -p xtask -- bundle-linux --bin target/release/kagi
          cd target/dist
          archives=(kagi-*-x86_64-linux.tar.gz)
          test "${#archives[@]}" -eq 1
          sha256sum "${archives[0]}" > SHA256SUMS-linux-x86_64.txt
      - name: Upload installer fixture artifact before advisory tests
        if: needs.changes.outputs.installer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: install-linux-x86_64
          path: |
            target/dist/kagi-*-x86_64-linux.tar.gz
            target/dist/SHA256SUMS-linux-x86_64.txt
          if-no-files-found: error
      - name: cargo test --workspace
        run: cargo test --workspace

  # The advisory job may fail after artifact upload; always attempt the proof
  # when selected. Missing artifacts / failed packaging must fail this job.
  install-linux:
    name: install (Linux)
    needs: [changes, test-linux]
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.installer == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dynamic libraries for the release binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libx11-6 libxcb1 libfontconfig1 libfreetype6 \
            libasound2t64 libvulkan1 libzstd1
      - uses: actions/download-artifact@v4
        with:
          name: install-linux-x86_64
          path: installer-dist
      - name: Exercise real installer against local release assets
        run: uv run --frozen --project ci install-fixture --dist installer-dist
  # ── ADVISORY: fmt + clippy (pre-existing v0.2.0 debt; tracked for S7 cleanup) ─
  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The LOC gate at the end of this job runs through the `ci/` uv
      # project, and ubuntu runners do not ship uv.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: Install gpui system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libvulkan-dev libzstd-dev
      - name: cargo clippy --workspace
        run: cargo clippy --workspace
      - name: LOC gate — new files stay under 800 LOC (T-LOC-GATE-001)
        run: uv run --frozen --project ci check-loc
