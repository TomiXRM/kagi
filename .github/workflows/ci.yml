name: ci

# ADR-0077 (v1.0 re-architecture): the project had NO test CI before this — only
# release.yml. This workflow gates `main` (and the `develop` integration branch):
# `cargo test --workspace` must stay green, and the repository invariants (the
# UI never calls git2, and the rest) are enforced by the `kagi-checks` uv
# project in `ci/`. fmt/clippy and the Linux test leg are ADVISORY for now
# (the v0.2.0 tree carries pre-existing fmt/clippy debt; making them blocking would
# red the board on day one — they are tracked for cleanup in S7).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── BLOCKING: repository invariants (one uv project, one dialect) ────────────
  #
  # Every gate lives in `ci/` as a uv project (`kagi-checks`) and runs as
  # `uv run --frozen --project ci check-<name>`. It used to be inline
  # `grep -rnE` here plus `find | awk` shell scripts: three dialects, each
  # platform-sensitive. BSD grep (what developers run on macOS) caps bounded
  # repetition at 255, so a valid GNU pattern silently matched *nothing* and
  # the gate went green having checked zero files — that shipped once (#454)
  # and a human, not CI, caught it. `check-all --selftest` now proves every
  # rule still flags its own positive sample, and `check-shell-hygiene` fails
  # the build if a gate reaches for grep/find/awk/sed -i or a bare interpreter
  # again.
  #
  # Jobs stay one-per-invariant so a red status check names the rule it broke.
  invariants:
    name: invariant — ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          # UI is git2-free (ADR-0072 / ADR-0078)
          - ui-git2
          # kagi-mcp is gpui-free (ADR-0163 / #331)
          - mcp-gpui
          # [kagi] contract lines go through klog!. Two gates on purpose:
          # `klog-raw` rejects every same-line `eprintln!("[kagi]…")` outright,
          # `klog` is the ratchet that tolerates the pre-existing *wrapped*
          # violations at their baseline count. The ratchet alone would let a
          # file swap a wrapped violation for a fresh same-line one at an
          # unchanged count (review finding, ADR-0096 / #396).
          - klog-raw
          - klog
          # kagi-ui-* crates never touch git2 / kagi-git (ADR-0121)
          - ui-core-layering
          # …nor import a sibling feature crate (ADR-0121)
          - ui-lateral
          # the ADR-0129 Verbatim escape hatch stays deleted
          - plan-verbatim
          # modal file lists are not silently truncated (#454)
          - modal-lists
          # gates stay in one dialect (this file included)
          - shell-hygiene
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: check-${{ matrix.check }}
        run: uv run --frozen --project ci check-${{ matrix.check }}

  # ── BLOCKING: the gates themselves stay lint-clean and type-checked ─────────
  gates-lint:
    name: gates — ruff + mypy + selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --frozen --project ci ruff check ci
      - name: ruff format --check
        run: uv run --frozen --project ci ruff format --check ci
      - name: mypy
        run: uv run --frozen --project ci mypy --config-file ci/pyproject.toml
      - name: rule selftest
        run: uv run --frozen --project ci check-all --selftest

  # ── BLOCKING: full test suite on macOS (the validated dev platform) ──────────
  test-macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  # ── ADVISORY: Linux test leg (gpui system deps; not yet validated headless) ──
  test-linux:
    name: test (Linux, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install gpui system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            libasound2-dev \
            libvulkan-dev \
            libzstd-dev
      - name: cargo test --workspace
        run: cargo test --workspace

  # ── ADVISORY: Windows release build (validates the cross-platform port) ──────
  build-windows:
    name: build (Windows, advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release -p kagi
        run: cargo build --release -p kagi
      - name: Bundle Windows zip
        run: cargo run -p xtask -- bundle-windows --bin target/release/kagi.exe
      - name: List dist
        run: dir target\dist

  # ── ADVISORY: fmt + clippy (pre-existing v0.2.0 debt; tracked for S7 cleanup) ─
  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The LOC ratchet at the end of this job runs through the `ci/` uv
      # project, and ubuntu runners do not ship uv.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: Install gpui system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libvulkan-dev libzstd-dev
      - name: cargo clippy --workspace
        run: cargo clippy --workspace
      - name: LOC ratchet (T-LOC-GATE-001)
        run: uv run --frozen --project ci check-loc
