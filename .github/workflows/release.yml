name: release

# ADR-0047 / W20-RELEASE: cross-platform distribution Phase 1 (unsigned/ad-hoc).
# Triggered by `v*` tags. Builds macOS (.app + .dmg) and Linux (tar.gz) artifacts
# via the `xtask` helper, generates SHA256SUMS, and uploads everything to a
# single DRAFT GitHub release for manual review before publishing.

on:
  push:
    tags:
      - "v*"
  # Allow a manual dry-run (builds artifacts, still uploads to a draft release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Gate: the released commit must have green blocking CI (#395) ──────────
  # v0.30.0 shipped from a red main because this workflow only verified that
  # the build compiles. Query the check runs on the tagged commit and require
  # every blocking ci.yml job to have concluded success before building.
  ci-green:
    name: verify blocking CI is green
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Assert blocking ci jobs succeeded for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The blocking jobs from ci.yml (advisory continue-on-error legs
          # excluded).
          #
          # #467 turned the per-invariant jobs into one matrix job, renaming
          # every check ("invariant — UI is git2-free" became
          # "invariant — ui-git2"). This job's hardcoded list still named the
          # old jobs, which no longer exist, so every lookup read as "pending"
          # and v0.33.0 sat here for 30 minutes and failed. So: no list. Every
          # check run whose name starts with "invariant — " must be green, plus
          # the macOS test leg — which keeps working when a gate is added or
          # renamed.
          required_exact=("test (macOS)")
          for attempt in $(seq 1 30); do
            runs=$(gh api --method GET --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '.check_runs[] | [.name, (.conclusion // "pending")] | @tsv')

            pending=0 red=0 invariants=0
            while IFS=$'\t' read -r name conclusion; do
              [ -n "$name" ] || continue
              case "$name" in
                "invariant — "*) invariants=$((invariants + 1)) ;;
                "test (macOS)") ;;
                *) continue ;;
              esac
              echo "$name: $conclusion"
              case "$conclusion" in
                success) ;;
                pending|"") pending=1 ;;
                *) red=1 ;;
              esac
            done <<< "$runs"

            # A missing leg must not read as green: require the macOS test job
            # to exist, and at least one invariant check.
            for name in "${required_exact[@]}"; do
              # Pure-bash substring test: `check-shell-hygiene` bans grep in a
              # workflow, and it is right to — this needs no regex dialect.
              case "$runs" in
                *"$name"*) ;;
                *)
                  echo "$name: absent"
                  pending=1
                  ;;
              esac
            done
            if [ "$invariants" -eq 0 ]; then
              echo "no invariant checks reported yet"
              pending=1
            fi

            if [ "$red" -eq 1 ]; then
              echo "::error::blocking CI is red on ${GITHUB_SHA} — a red commit must not produce a release (#395). Fix main, retag."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "OK: ${invariants} invariant checks + the macOS test leg are green on ${GITHUB_SHA}."
              exit 0
            fi
            echo "CI not finished on ${GITHUB_SHA} — waiting 60s (attempt ${attempt}/30)…"
            sleep 60
          done
          echo "::error::blocking CI never went green on ${GITHUB_SHA} within 30 min — check that ci ran on this commit (#395)."
          exit 1

  build:
    name: build ${{ matrix.target }}
    needs: ci-green
    runs-on: ${{ matrix.os }}
    # Per-leg opt-in: the linux-arm64 leg sets continue-on-error so a missing
    # private-repo arm64 runner does not block the release (ADR-0047 追補).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            kind: macos
            arch: arm64
          - os: ubuntu-latest
            target: linux-x86_64
            kind: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            kind: linux
            arch: aarch64
          - os: windows-latest
            target: windows-x86_64
            kind: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify runner architecture
        shell: bash
        run: |
          echo "uname -m: $(uname -m)"

      # ── Linux: gpui system build dependencies ─────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            libasound2-dev \
            libvulkan-dev \
            libzstd-dev \
            dpkg-dev

      # ── macOS: .app (ad-hoc signed) + .dmg ────────────────────────────────
      # v0.26.0 failed here with `hdiutil create: No space left on device`.
      #
      # The `df` lines are the point of this step; the `rm`s have not been
      # shown to do anything. On the v0.27.0 run the runner had 97Gi free
      # before the step and 97Gi after — none of these paths existed on that
      # image, and the disk was never tight. So the v0.26.0 failure is still
      # unexplained, and this step is instrumentation for the next one rather
      # than a fix that has been proven to work. Keep the `df` either side so
      # that failure arrives with a number attached.
      #
      # Best-effort by design: a runner image without these paths must not
      # fail the build, hence `|| true`.
      - name: Free disk space for the dmg
        if: matrix.kind == 'macos'
        run: |
          df -h / | tail -1
          sudo rm -rf /Applications/Xcode_1[45]*.app || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          df -h / | tail -1

      - name: Bundle macOS app + dmg
        if: matrix.kind == 'macos'
        run: |
          cargo run -p xtask -- bundle-macos
          cargo run -p xtask -- dmg-macos

      # ── Linux: release build + tar.gz ─────────────────────────────────────
      - name: Build Linux release binary
        if: matrix.kind == 'linux'
        run: cargo build --release -p kagi

      - name: Bundle Linux tar.gz
        if: matrix.kind == 'linux'
        run: cargo run -p xtask -- bundle-linux --bin target/release/kagi

      # ── Linux: AppImage zip (ADR-0047 追補, W21-APPIMAGE) ──────────────────
      # Fetch the matching appimagetool (FUSE-free via --appimage-extract-and-run,
      # which xtask passes through) and build Kagi-<arch>.AppImage + the zip.
      - name: Download appimagetool
        if: matrix.kind == 'linux'
        run: |
          url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL -o "${RUNNER_TEMP}/appimagetool" "$url"
          chmod +x "${RUNNER_TEMP}/appimagetool"
          echo "APPIMAGETOOL=${RUNNER_TEMP}/appimagetool" >> "$GITHUB_ENV"

      - name: Bundle AppImage zip
        if: matrix.kind == 'linux'
        run: cargo run -p xtask -- bundle-appimage --bin target/release/kagi --arch ${{ matrix.arch }}

      # ── Linux: .deb package (cargo-deb; config in [package.metadata.deb]) ─
      - name: Build .deb package
        if: matrix.kind == 'linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build -o target/dist/

      # ── Windows: release build + zip (assets are embedded in the .exe) ────
      - name: Build Windows release binary
        if: matrix.kind == 'windows'
        run: cargo build --release -p kagi

      - name: Bundle Windows zip
        if: matrix.kind == 'windows'
        run: cargo run -p xtask -- bundle-windows --bin target/release/kagi.exe

      # ── Checksums over this leg's artifacts ───────────────────────────────
      - name: Generate SHA256SUMS
        shell: bash
        working-directory: target/dist
        run: |
          shopt -s nullglob
          files=( *.dmg *.tar.gz *.zip *.deb )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts produced" >&2
            exit 1
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.target }}.txt"

      # Hand artifacts to the single release job (avoids concurrent
      # action-gh-release invocations racing and creating duplicate drafts).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/dist/*.dmg
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.deb
            target/dist/SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
