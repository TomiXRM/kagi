[project]
# The repo's invariant gates, as a uv project rather than loose scripts.
#
# Why: the gates used to be a mix of inline `grep -rnE` in the workflow,
# `find | awk` in `check-loc.sh` and `tr | grep -E` in `check-modal-lists.sh`.
# Three dialects, each platform-sensitive — BSD grep (what developers run on
# macOS) caps bounded repetition at 255, so a valid GNU pattern silently
# matches *nothing* and the gate passes green. That shipped once (#454) and a
# human, not CI, caught it.
#
# Everything runs through uv now: `uv run --project ci check-<name>`. One
# interpreter (pinned below), one regex dialect, a lockfile, and `check-all
# --selftest` proving every rule still matches its own positive sample.
name = "kagi-checks"
version = "0.1.0"
description = "Repository invariant gates for kagi (CI + local, one dialect)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
# One command per gate, named after the check (`ci/check-loc.sh` before).
check-all = "kagi_checks.cli:check_all"
check-ui-git2 = "kagi_checks.cli:check_ui_git2"
check-app-layering = "kagi_checks.cli:check_app_layering"
check-fault-test-only = "kagi_checks.cli:check_fault_test_only"
check-mcp-gpui = "kagi_checks.cli:check_mcp_gpui"
check-klog = "kagi_checks.cli:check_klog"
check-klog-raw = "kagi_checks.cli:check_klog_raw"
check-ui-core-layering = "kagi_checks.cli:check_ui_core_layering"
check-ui-lateral = "kagi_checks.cli:check_ui_lateral"
check-plan-verbatim = "kagi_checks.cli:check_plan_verbatim"
check-recovery-safe-advice = "kagi_checks.cli:check_recovery_safe_advice"
check-modal-lists = "kagi_checks.cli:check_modal_lists"
check-shell-hygiene = "kagi_checks.cli:check_shell_hygiene"
check-e2e-window-helper = "kagi_checks.cli:check_e2e_window_helper"
check-busy-labels = "kagi_checks.cli:check_busy_labels"
check-skill-refs = "kagi_checks.cli:check_skill_refs"
check-adr-unique-number = "kagi_checks.cli:check_adr_unique_number"
check-loc = "kagi_checks.cli:check_loc"
check-blocking-ci = "kagi_checks.release_ci:check_blocking_ci"
check-release-ci = "kagi_checks.release_ci:check_release_ci"

[dependency-groups]
dev = ["mypy>=1.14", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ci/src"]
mypy_path = ["ci/src"]
explicit_package_bases = true
