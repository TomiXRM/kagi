# kagi-web — WASM harness for browser-based UI e2e tests (Playwright).
#
# Compiles the production Settings view and pure-domain layout stories against
# gpui_web. Native effects remain in the native host; browser adapters provide
# explicit deterministic verification fixtures. Built by scripts/build-web.sh.
[package]
name = "kagi-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kagi-domain = { path = "../kagi-domain" }
kagi-ui-core = { path = "../kagi-ui-core" }
kagi-ui-settings = { path = "../kagi-ui-settings", features = ["gui-e2e"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "b004e595cf5d" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "b004e595cf5d" }
serde_json = "1"
# Same rev-less zed git deps as the root Cargo.toml (cargo unifies on the
# workspace Cargo.lock pin).
gpui = { git = "https://github.com/zed-industries/zed" }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
