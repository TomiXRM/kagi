# Kagi-owned terminal frontend and PTY integration (ADR-0035).
# Originally imported from Leonard Seibold's gpui-terminal 0.1.0 registry
# package; the normalized manifest layout is historical, not a generated-file
# restriction. Kagi maintains this manifest and source in-tree.
# Upstream origin: https://github.com/zortax/gpui-terminal
# Preserve original authorship and the MIT OR Apache-2.0 license notices.

[package]
edition = "2024"
name = "gpui-terminal"
version = "0.1.0"
authors = ["Leonard Seibold <git[@]zrtx.de"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Kagi-owned GPUI terminal frontend, derived from gpui-terminal"
readme = "README.md"
license = "MIT OR Apache-2.0"
# Upstream origin, not the maintenance location of this in-tree package.
repository = "https://github.com/zortax/gpui-terminal"

[lib]
name = "gpui_terminal"
path = "src/lib.rs"

[[bin]]
name = "gpui-terminal"
path = "src/main.rs"

[dependencies.alacritty_terminal]
version = "0.25.1"

[dependencies.anyhow]
version = "1"

[dependencies.arboard]
version = "3"
features = ["wayland-data-control"]

[dependencies.flume]
version = "0.12"

# kagi: zed main git dep, same rev-less source as the root Cargo.toml so cargo
# unifies to one gpui (pin lives in the workspace Cargo.lock). runtime_shaders
# moved to gpui_platform in the crate split.
[dependencies.gpui]
git = "https://github.com/zed-industries/zed"

[dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]

[dependencies.parking_lot]
version = "0.12"

[dependencies.portable-pty]
version = "0.9"

[dependencies.ropey]
version = "1"
